spring:
  application:
    name: order-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${SPRING_DATASOURCE_USERNAME:orderstream}
    password: ${SPRING_DATASOURCE_PASSWORD:orderstream}
    hikari:
      # ================================================================
      # 连接池大小
      # ================================================================
      # HikariCP 官方公式：连接数 = (CPU 核心数 * 2) + 有效磁盘数
      #
      # 反直觉但正确：连接池【越大越慢】。
      #   真正能并行执行 SQL 的能力受限于数据库的 CPU 核数和磁盘 IO。
      #   连接开多了只是把排队从连接池挪进数据库内部，
      #   还额外付出上下文切换开销 + Postgres 每连接一个 OS 进程的内存代价
      #   （Postgres 是 process-per-connection，和 MySQL 的 thread-per-connection 不同，
      #    所以它对连接数比 MySQL 敏感得多）。
      #   小池 + 排队的整体吞吐和延迟反而更好，本质是 Little's Law。
      #
      # order-service 的池子比别的服务大，因为它有【四类】并发的连接使用者：
      #   1. HTTP 请求线程（下单、查询）
      #   2. Kafka 消费线程（consumer-concurrency = 3）
      #   3. OutboxRelay 定时任务
      #   4. StuckSagaSweeper 定时任务
      #
      # 【这是个真实的容量陷阱】：只按 HTTP 并发估算池大小，
      # 会漏掉后台线程的需求，结果是定时任务偶发地拿不到连接、静默失败。
      # 正确算法：HTTP 需要的 + 消费者并发数 + 定时任务数 + 余量
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5

      # ================================================================
      # 2 秒快速失败，不是 30 秒
      # ================================================================
      # 原版是 30000ms，这是个真实的错误配置：
      #   流量高峰时，拿不到连接的请求会各自傻等 30 秒才失败。
      #   这些等待中的请求占着线程，形成线程饥饿，故障被放大。
      #   用户体验是"整站卡死 30 秒"，而不是"快速收到一个错误"。
      #
      # fail fast 远好于 fail slow：调用方能立刻重试或降级，队列不会无限堆积。
      connection-timeout: 2000

      idle-timeout: 600000
      # 必须【小于】数据库端和中间件（RDS Proxy、pgbouncer）的空闲超时，
      # 否则会拿到已被对端关闭的死连接，表现为随机的 connection reset
      max-lifetime: 1800000
      leak-detection-threshold: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: order-saga-orchestrator

  # ------------------------------------------------------------------
  # 分页上限 —— 这一项不配的话，分页等于没做
  # ------------------------------------------------------------------
  data:
    web:
      pageable:
        default-page-size: 20
        # @PageableDefault(size=20) 只设了【默认值】，客户端传 ?size=100000
        # 依然会被接受。必须在这里封顶，否则一个请求就能把数据库和内存打爆。
        # 这是分页接口最常见的漏洞：以为写了分页，其实客户端可以随意突破
        max-page-size: 100

  # ------------------------------------------------------------------
  # 【@Scheduled 的线程池 —— 默认只有 1 个线程，这是个真实踩过的坑】
  # ------------------------------------------------------------------
  # Spring Boot 的 TaskScheduler 默认 pool size = 1，
  # 意味着一个服务里【所有】 @Scheduled 任务共用一个线程，串行执行。
  #
  # 我踩到的现象：
  #   压测后留下 3 万个卡死的 Saga，StuckSagaSweeper 一次性把它们
  #   全部载入并逐个补偿，单次执行耗时 3 分半。
  #   在这 3 分半里，OutboxRelay 【一次都没被调度】——
  #   5 万条待发事件完全停滞，attempt_count 一直是 0。
  #
  #   表现出来是"Outbox 坏了"，实际上是"Outbox 根本没机会运行"。
  #   排查时非常有迷惑性：relay 的代码、配置、Kafka 连接全都正常。
  #
  # 【教训】
  #   只要一个应用里有多于一个 @Scheduled 任务，就必须显式配置线程池。
  #   否则任何一个任务变慢，都会静默地饿死其他所有任务 ——
  #   而且它们之间【本来毫无关系】，这种耦合完全是隐式的。
  #
  #   这也是"资源隔离"思想的一个体现：
  #   不相关的工作不该共享一个可能被耗尽的资源。
  task:
    scheduling:
      pool:
        size: 5
      thread-name-prefix: scheduled-

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

orderstream:
  menu-service:
    url: ${MENU_SERVICE_URL:http://localhost:8082}
    # 超时的层次关系（由内到外必须递增）：
    #   read-timeout(2s) < overall-timeout(3s) < 网关 response-timeout(10s)
    # 搞反了会产生"幽灵请求"：外层已断开，内层还在跑，
    # 用户看到失败但操作其实成功了 —— 在下单场景下就是重复订单的来源
    connect-timeout: 1s
    read-timeout: 2s
    overall-timeout: 3s

  kafka:
    # 必须 <= topic 分区数(6)。默认值 1 是原版最大的吞吐瓶颈
    consumer-concurrency: 3

  outbox:
    relay:
      enabled: true
      # 轮询间隔(ms)。决定事件投递的额外延迟（平均 = 间隔/2）
      interval: 200
      # 【批量大小在改成"整批异步发送"之后才真正有意义】
      #   串行发送时，batch-size 调大只会让单轮耗时线性增长，吞吐不变。
      #   改成整批并发后，一轮能在几十毫秒内发完 500 条，
      #   吞吐从约 30 条/秒提升到约 2000 条/秒。
      #
      #   不是越大越好：整批在一个事务里持有行锁，批次太大会拉长锁持有时间，
      #   影响多实例并行（虽然有 SKIP LOCKED，但大批次意味着一个实例
      #   一次就把待发消息全捞走了，其他实例反而没事干）。
      batch-size: 500
      # 【整批】的总超时，不是单条的。见 OutboxRelay 里 remainingMs 的计算
      send-timeout: 10s

  saga:
    # 判定 Saga 卡死的阈值。正常流程 < 2 秒，这里留了 150 倍余量防误杀。
    # 必须【小于】menu-service 的 stale-reservation-timeout(10 分钟)，
    # 保证正常补偿路径先动手，库存兜底只作为最后防线
    stuck-threshold: PT5M
    sweep-interval: 60000
    # 每轮处理上限。故障恢复后可能积压上万条待补偿的 Saga，
    # 一口气全处理会产生巨大的负载尖峰，把刚恢复的系统再打垮一次。
    # 分批限速是所有补偿/重试类任务的基本纪律
    max-per-sweep: 500

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.orderstream: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-no-cid}] %logger{36} - %msg%n"
