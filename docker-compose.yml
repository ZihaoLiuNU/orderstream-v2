# ============================================================================
# OrderStream 完整拓扑：3 个基础设施容器 + 7 个应用容器
#
# 启动：  docker compose up --build -d
# 只起基础设施（应用在 IDE 里跑，方便调试）： docker compose up -d postgres redis kafka
# ============================================================================

# YAML 锚点：把所有 Java 服务的公共配置抽出来，避免 7 份重复
x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment: &app-env
    SPRING_PROFILES_ACTIVE: docker
    # 容器内所有服务统一监听 8080。各服务 application.yml 里的默认端口
    # (8081~8086) 是给"在 IDE 里本地跑"用的，那时需要错开避免冲突。
    # 容器有独立的网络命名空间，端口不会撞车，统一成 8080 让
    # healthcheck 和 Dockerfile 的 EXPOSE 可以写死
    SERVER_PORT: 8080
    SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    SPRING_DATA_REDIS_HOST: redis
    # 密钥从宿主机环境变量注入，不写死在文件里（配合 .env，且 .env 已在 .gitignore 中）
    JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必须设置，请复制 .env.example 为 .env}
  depends_on:
    kafka:
      condition: service_healthy
  # 所有服务共用一套健康检查：Actuator 的 /health
  # start_period 很关键：Spring Boot 冷启动要十几秒，没有它会在启动期间被误判为不健康而反复重启
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 60s

services:
  # ==========================================================================
  # 基础设施
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: os-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: orderstream
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderstream}
    ports:
      - "5432:5432"   # 暴露给宿主机，方便你用 DBeaver/psql 直接查表看 Saga 状态
    volumes:
      - postgres_data_v2:/var/lib/postgresql/data
      # 首次启动时执行，为每个服务创建独立 database（database-per-service）
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderstream"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: os-redis
    # appendonly yes = AOF 持久化。购物车数据丢了用户会骂人，所以不能纯内存。
    # 但也没必要上 Postgres：购物车是高频读写、天然易失、且有 TTL 的数据，
    # 用关系库存它是杀鸡用牛刀（每次加菜都是一次磁盘事务）
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # ------------------------------------------------------------------
    # Apache 官方 Kafka 镜像（不是 confluentinc/cp-kafka）
    #
    # 选它的理由：
    #   1) KRaft 原生：Kafka 3.3+ 起不再需要 ZooKeeper，broker 自己用 Raft 选举。
    #      少一个必须运维的分布式组件，也少一类故障模式
    #      （ZK 和 Kafka 元数据不一致是很难排查的问题）
    #   2) 镜像小得多：官方镜像约 350MB，cp-kafka 基于 RedHat UBI 超过 800MB
    #   3) 没有 Confluent 那层"环境变量 -> server.properties"的转换脚本，
    #      配置和官方文档一一对应，出问题时好查
    #   4) 自动完成存储格式化（KRaft 需要 kafka-storage format），不用额外的 init 容器
    # ------------------------------------------------------------------
    image: apache/kafka:3.7.0
    container_name: os-kafka
    ports:
      - "9092:9092"   # 宿主机访问用（压测脚本、kafka-console-consumer）
    environment:
      KAFKA_NODE_ID: 1
      # 单进程同时是 broker 和 controller，本地开发够用。
      # 生产环境 controller 要独立部署且是奇数个（3 或 5），才能正常选举
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # ----------------------------------------------------------------
      # 【双 listener —— Kafka on Docker 最经典的坑】
      # ----------------------------------------------------------------
      # Kafka 客户端的连接流程是两步的：
      #   1) 连上 bootstrap 地址，拿到集群元数据
      #   2) 【用元数据里的 advertised.listeners 地址重新连接】真正的 broker
      #
      # 所以如果只配一个 advertised 地址：
      #   配 kafka:29092  -> 宿主机解析不了 "kafka" 这个主机名，超时
      #   配 localhost:9092 -> 容器里的 localhost 指向它自己，连不上 Kafka
      #
      # 解法是配两个 listener，让容器内外各走各的：
      #   容器之间   -> kafka:29092（Docker 内置 DNS 能解析服务名）
      #   宿主机     -> localhost:9092（端口映射）
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      # 单 broker 只能 1 副本。生产至少 3 副本，
      # 并且必须配合 min.insync.replicas=2 —— 只有这样 acks=all 才真正有意义
      # （否则 ISR 里只剩 leader 时，acks=all 会退化成 acks=1）
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # 默认 3 秒的 rebalance 延迟是为了等更多消费者一起加入再统一分配，
      # 本地开发时纯属浪费启动时间
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # 【关掉自动建 topic】—— 生产环境必须关。
      # 否则 topic 名写错一个字母会被静默创建成一个新 topic，
      # 消息发进去再也没人消费，而且完全没有报错。
      # topic 由 KafkaTopicsConfig 显式声明（含分区数和保留期）
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    # 健康检查窗口要按【最慢的环境】定：GitHub Actions 的 2 核 runner 上
    # kafka-broker-api-versions.sh 本身就是个 JVM 进程，冷启动一次十几秒。
    # 原来 20s + 12×10s 的窗口偶发不够，Kafka 被判 unhealthy，
    # 依赖它的 7 个服务直接拒绝启动，整条 e2e 流水线随机变红
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 20s
      retries: 20
      start_period: 60s

  # ==========================================================================
  # 应用服务
  # ==========================================================================

  # 唯一对外暴露端口的服务。所有流量都必须过它。
  api-gateway:
    <<: *app-common
    container_name: os-gateway
    build:
      context: .
      args:
        MODULE: api-gateway
    ports:
      - "8080:8080"
    environment:
      <<: *app-env
      SPRING_DATA_REDIS_HOST: redis
      # ----------------------------------------------------------------
      # 限流阈值。默认值是【生产配置】—— 保守、保护系统。
      #
      # 压测时通过宿主机环境变量临时放开，用来测出系统的真实容量：
      #   RL_ORDER_RATE=500 RL_AUTH_RATE=200 docker compose up -d api-gateway
      #
      # 【为什么必须能放开】
      #   如果限流阈值(10/s)远低于系统容量(150/s)，压测测到的就是限流器，
      #   而不是系统。拿着这种数字去做容量规划会得出完全错误的结论。
      #   正确顺序永远是：先测容量，再按容量设限流。
      # ----------------------------------------------------------------
      RL_AUTH_RATE:   ${RL_AUTH_RATE:-5}
      RL_AUTH_BURST:  ${RL_AUTH_BURST:-10}
      RL_ORDER_RATE:  ${RL_ORDER_RATE:-10}
      RL_ORDER_BURST: ${RL_ORDER_BURST:-20}
      RL_MENU_RATE:   ${RL_MENU_RATE:-50}
      RL_MENU_BURST:  ${RL_MENU_BURST:-100}
      RL_CART_RATE:   ${RL_CART_RATE:-30}
      RL_CART_BURST:  ${RL_CART_BURST:-60}
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  auth-service:
    <<: *app-common
    container_name: os-auth
    build:
      context: .
      args:
        MODULE: auth-service
    # 注意：没有 ports 映射。
    # 这【不是】疏忽，是安全设计的一部分：下游服务只在 Docker 内部网络可达，
    # 宿主机和外网都碰不到。因为网关认证后是用 X-User-Role 这类头把身份传给下游的，
    # 如果下游端口直接暴露，任何人都能绕过网关自己加一个 X-User-Role: ADMIN 头。
    # 生产环境对应的是「服务放私有子网，只有 ALB/Ingress 在公网」
    expose:
      - "8080"
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      # 压测需要大量账号。双保险（@Profile("!prod") + 这个开关）保证
      # 生产环境绝不会塞进测试数据，见 DevDataInitializer
      SEED_DATA_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  menu-service:
    <<: *app-common
    container_name: os-menu
    build:
      context: .
      args:
        MODULE: menu-service
    expose:
      - "8080"
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/menu_db
      SEED_DATA_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  cart-service:
    <<: *app-common
    container_name: os-cart
    build:
      context: .
      args:
        MODULE: cart-service
    expose:
      - "8080"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  order-service:
    <<: *app-common
    container_name: os-order
    build:
      context: .
      args:
        MODULE: order-service
    expose:
      - "8080"
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
      # 同步调用下游的地址。Docker Compose 自带 DNS，服务名即主机名 ——
      # 这就是最简单的服务发现，不需要 Eureka/Consul。
      # K8s 里同理（Service DNS）。Eureka 是给没有平台级 DNS 的环境用的
      MENU_SERVICE_URL: http://menu-service:8080
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payment-service:
    <<: *app-common
    container_name: os-payment
    build:
      context: .
      args:
        MODULE: payment-service
    expose:
      - "8080"
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    <<: *app-common
    container_name: os-notification
    build:
      context: .
      args:
        MODULE: notification-service
    expose:
      - "8080"
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  # 卷名带 _v2 后缀：原单体项目用的是 postgres:15，数据目录格式与 16 不兼容。
  # 用新卷而不是删旧卷，这样旧数据原封不动保留着，需要时还能挂回 postgres:15 查看。
  #
  # 更重要的是：init-databases.sh 只在【数据目录为空】时执行
  # （Postgres 官方镜像的行为），复用旧卷的话那 5 个服务库根本不会被创建。
  # 所以这里必须是一个全新的卷。
  postgres_data_v2:
  redis_data:
