spring:
  application:
    name: payment-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${SPRING_DATASOURCE_USERNAME:orderstream}
    password: ${SPRING_DATASOURCE_PASSWORD:orderstream}
    hikari:
      # payment-service 的并发几乎全部来自 Kafka 消费线程（consumer-concurrency=6），
      # HTTP 查询流量很小。池子要覆盖：6 个消费线程 + OutboxRelay + 少量查询 + 余量
      maximum-pool-size: ${DB_POOL_SIZE:15}
      minimum-idle: 3
      connection-timeout: 2000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: payment-service

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  # ------------------------------------------------------------------
  # 【@Scheduled 的线程池 —— 默认只有 1 个线程，这是个真实踩过的坑】
  # ------------------------------------------------------------------
  # Spring Boot 的 TaskScheduler 默认 pool size = 1，
  # 意味着一个服务里【所有】 @Scheduled 任务共用一个线程，串行执行。
  #
  # 我踩到的现象：
  #   压测后留下 3 万个卡死的 Saga，StuckSagaSweeper 一次性把它们
  #   全部载入并逐个补偿，单次执行耗时 3 分半。
  #   在这 3 分半里，OutboxRelay 【一次都没被调度】——
  #   5 万条待发事件完全停滞，attempt_count 一直是 0。
  #
  #   表现出来是"Outbox 坏了"，实际上是"Outbox 根本没机会运行"。
  #   排查时非常有迷惑性：relay 的代码、配置、Kafka 连接全都正常。
  #
  # 【教训】
  #   只要一个应用里有多于一个 @Scheduled 任务，就必须显式配置线程池。
  #   否则任何一个任务变慢，都会静默地饿死其他所有任务 ——
  #   而且它们之间【本来毫无关系】，这种耦合完全是隐式的。
  #
  #   这也是"资源隔离"思想的一个体现：
  #   不相关的工作不该共享一个可能被耗尽的资源。
  task:
    scheduling:
      pool:
        size: 5
      thread-name-prefix: scheduled-

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful

orderstream:
  kafka:
    # ================================================================
    # 【这个值是整个系统吞吐的关键瓶颈】
    # ================================================================
    # payment-service 是唯一带显著处理延迟的环节（模拟支付网关往返）。
    #
    # 吞吐 = concurrency / 单条处理耗时
    #      = 6 / 0.05 秒 = 120 单/秒
    #
    # 原版用的是默认值 1，配合写死的 300ms 延迟，上限只有 3.3 单/秒 ——
    # "500+ 并发"在那个配置下要跑 150 秒。
    #
    # 硬上限是 topic 的分区数(6)：一个分区在同一消费者组内
    # 只能被一个线程消费，设成 12 会有 6 个线程永远空闲。
    # 要突破就得先加分区，或者加 payment-service 实例（Kafka 会自动重新分配分区）。
    consumer-concurrency: 6

  outbox:
    relay:
      enabled: true
      # 轮询间隔(ms)。决定事件投递的额外延迟（平均 = 间隔/2）
      interval: 200
      # 【批量大小在改成"整批异步发送"之后才真正有意义】
      #   串行发送时，batch-size 调大只会让单轮耗时线性增长，吞吐不变。
      #   改成整批并发后，一轮能在几十毫秒内发完 500 条，
      #   吞吐从约 30 条/秒提升到约 2000 条/秒。
      #
      #   不是越大越好：整批在一个事务里持有行锁，批次太大会拉长锁持有时间，
      #   影响多实例并行（虽然有 SKIP LOCKED，但大批次意味着一个实例
      #   一次就把待发消息全捞走了，其他实例反而没事干）。
      batch-size: 500
      # 【整批】的总超时，不是单条的。见 OutboxRelay 里 remainingMs 的计算
      send-timeout: 10s

  payment:
    # 模拟支付网关的往返延迟。
    #
    # 真实的 Stripe/支付宝是 200~500ms。这里默认 50ms 是为了让压测
    # 能在合理时间内跑完，压测报告里会同时给出 50ms 和 300ms 两组数据，
    # 明确说明"瓶颈在模拟的下游延迟，不在订单服务本身"。
    #
    # 【不要把它设成 0】—— 那样压测出来的数字是假的，
    # 因为它抹掉了真实系统中必然存在的、且最主要的延迟来源。
    simulated-latency-ms: ${PAYMENT_LATENCY_MS:50}

    # 模拟失败率。保留一个非零值很重要：
    # 它保证每次压测都会真实地触发 Saga 补偿路径，
    # 验证补偿逻辑在高并发下同样正确（而不是只在单元测试里正确）。
    failure-rate: ${PAYMENT_FAILURE_RATE:0.1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.orderstream: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-no-cid}] %logger{36} - %msg%n"
