spring:
  application:
    name: notification-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${SPRING_DATASOURCE_USERNAME:orderstream}
    password: ${SPRING_DATASOURCE_PASSWORD:orderstream}
    hikari:
      # 通知服务只有消费线程 + 少量查询，池子可以小
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 2000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50

  flyway:
    enabled: true
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  # ------------------------------------------------------------------
  # 【@Scheduled 的线程池 —— 默认只有 1 个线程，这是个真实踩过的坑】
  # ------------------------------------------------------------------
  # Spring Boot 的 TaskScheduler 默认 pool size = 1，
  # 意味着一个服务里【所有】 @Scheduled 任务共用一个线程，串行执行。
  #
  # 我踩到的现象：
  #   压测后留下 3 万个卡死的 Saga，StuckSagaSweeper 一次性把它们
  #   全部载入并逐个补偿，单次执行耗时 3 分半。
  #   在这 3 分半里，OutboxRelay 【一次都没被调度】——
  #   5 万条待发事件完全停滞，attempt_count 一直是 0。
  #
  #   表现出来是"Outbox 坏了"，实际上是"Outbox 根本没机会运行"。
  #   排查时非常有迷惑性：relay 的代码、配置、Kafka 连接全都正常。
  #
  # 【教训】
  #   只要一个应用里有多于一个 @Scheduled 任务，就必须显式配置线程池。
  #   否则任何一个任务变慢，都会静默地饿死其他所有任务 ——
  #   而且它们之间【本来毫无关系】，这种耦合完全是隐式的。
  #
  #   这也是"资源隔离"思想的一个体现：
  #   不相关的工作不该共享一个可能被耗尽的资源。
  task:
    scheduling:
      pool:
        size: 5
      thread-name-prefix: scheduled-

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8086}
  shutdown: graceful

orderstream:
  kafka:
    # 通知是纯本地操作（写库 + 打日志），很快，不需要很高并发。
    # 而且通知服务慢一点完全无所谓 —— 消息在 Kafka 里堆着不会丢，
    # 也不会反向影响订单流程。这正是把它异步化的意义
    consumer-concurrency: 3

  outbox:
    relay:
      # 这个服务是纯消费者，没有 outbox 表。
      # 真正让 OutboxRelay 不存在的是 NotificationServiceApplication 里
      # 精确到子包的 scanBasePackages（不扫 messaging.outbox）——
      # 这个开关只是第二道保险，防止将来有人改了扫描范围
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.orderstream: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-no-cid}] %logger{36} - %msg%n"
